name: End-to-End DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: "pip" }
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - run: pytest -v tests/

  docker-cd-deploy:
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devops-mini-app:latest .
      - run: |
          docker run -d -p 5000:5000 --name running-devops-app devops-mini-app:latest
          sleep 5
          curl --fail http://localhost:5000/health || exit 1
